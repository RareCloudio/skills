# nginx in front of a PHP app (Laravel, WordPress, Symfony) run by PHP-FPM on the same server.
# These lines go inside the port 443 server block of nginx-site.conf, in place of its
# `location / { proxy_pass ... }`; the redirect, the certificates and the headers stay as they
# are. See references/web-and-https.md, "A PHP app behind PHP-FPM".
#
# Placeholders, with the sample values the template is checked with:
#   <ROOT>        the folder the web serves, the app's public folder: Laravel's public/,
#                 WordPress's own folder; never the project root (sample: /srv/shop/current/public)
#   <FPM_SOCKET>  PHP-FPM's socket: /run/php/php8.2-fpm.sock on Debian 12,
#                 /run/php/php8.3-fpm.sock on Ubuntu 24.04, /run/php-fpm/www.sock on the RHEL
#                 family (sample: /run/php/php8.2-fpm.sock)
#
# Check: nginx -t && systemctl reload nginx; then request a page, a missing .php file (404) and
# /.env (403) from outside.

root <ROOT>;
index index.php index.html;

# Anything that is not a file goes to the front controller, with its query string.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    # Only a .php file that exists reaches PHP-FPM; nginx answers 404 for anything else, so PHP
    # is never asked to work out which file a path such as /uploads/a.jpg/x.php meant.
    try_files $fastcgi_script_name =404;
    include /etc/nginx/fastcgi_params;
    # $realpath_root resolves a `current` symlink, so a new release is used after a deploy
    # instead of PHP's cached path to the old one.
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_pass unix:<FPM_SOCKET>;
}

# Dotfiles (.env, .git) are never served; the ACME challenge folder stays reachable.
location ~ /\.(?!well-known/) {
    deny all;
}
