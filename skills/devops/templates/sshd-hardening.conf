# sshd drop-in: key-only logins, no direct root login.
#
# Install as /etc/ssh/sshd_config.d/00-hardening.conf (owner root, mode 0644). Debian 12,
# Ubuntu 24.04 and AlmaLinux 9 all read that folder from the top of /etc/ssh/sshd_config.
# The 00- prefix matters: for most keywords sshd keeps the first value it reads, and the drop-ins
# are read in file-name order, so a file such as 50-cloud-init.conf or 25-permitrootlogin.conf
# would otherwise win over this one without any error.
#
# Install it only after a non-root user has logged in with a key and run sudo, in a second
# session that stays open (see references/server-hardening.md).
#
# Check before reloading, and read the effective values back:
#   sudo sshd -t
#   sudo sshd -T | grep -E '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|authenticationmethods) '
#
# Placeholders: none.

# Root logs in through the admin user and sudo, so a stolen root key is not enough on its own.
PermitRootLogin no

# Keys only. Password guessing never stops on a public address.
PasswordAuthentication no
KbdInteractiveAuthentication no

# Holds even if another drop-in read before this one turns passwords back on.
AuthenticationMethods publickey

X11Forwarding no
