# nginx in front of one app: HTTP sends people to HTTPS, HTTPS proxies to the app, WebSockets
# pass through. Certificates come from certbot with the webroot method, so certbot never edits
# this file. See references/web-and-https.md for the order to put it in place.
#
# Placeholders, with the sample values the template is checked with:
#   <DOMAIN>    the name visitors type; it must already resolve to this server on A and AAAA
#               (sample: app.example.com)
#   <UPSTREAM>  where the app listens, best on loopback so only nginx reaches it
#               (sample: 127.0.0.1:3000)
#   <MAX_BODY>  the largest request body the app accepts, uploads included (sample: 25m)
#
# Goes in /etc/nginx/sites-available/<DOMAIN>.conf with a link in sites-enabled (Debian and
# Ubuntu), or in /etc/nginx/conf.d/<DOMAIN>.conf (RHEL family and the official nginx packages).
# Check before every reload: nginx -t && systemctl reload nginx
#
# The certificate files below do not exist before the first issuance, and nginx -t fails on a
# missing file. Put the port 80 server in place alone first, issue the certificate, then add
# the port 443 server.

# Sets the Connection header for the app: "upgrade" when the client asks for a WebSocket.
# nginx accepts a second map for the same variable without a word, and the one loaded last
# then applies to every site. When a second site comes from this template, move this map to
# its own file (/etc/nginx/conf.d/connection-upgrade.conf) and delete it from both sites.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # certbot certonly --webroot -w /var/www/letsencrypt writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2" on the listen line works on every nginx in use today. From nginx 1.25.1 it prints
    # a deprecation warning; there, write "listen 443 ssl;" and a separate "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    # HSTS tells browsers to refuse plain HTTP for this name for max-age seconds. Start small,
    # raise it only once HTTPS has worked for a while; see the reference for the lock-in.
    # add_header Strict-Transport-Security "max-age=300" always;

    # The default is 1m, which turns most uploads into "413 Request Entity Too Large".
    client_max_body_size <MAX_BODY>;

    location / {
        proxy_pass http://<UPSTREAM>;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # nginx is the first hop here, so it overwrites what the client claims. Behind another
        # proxy or load balancer, use set_real_ip_from for that hop instead (see the reference).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Time allowed between two reads from the app. An idle WebSocket is closed after this
        # long, so raise it (for example to 1h) when the app keeps sockets open without pings.
        proxy_read_timeout 60s;
    }
}
